# ── Telegraf — Kármán gNMI streaming telemetry ─────────────────────────────
# Subscribes to TerminAttr on each gNMI-managed device and exposes metrics
# on :9273 for Prometheus to scrape.
#
# To add a device: append its address to the addresses list under [inputs.gnmi].
# ─────────────────────────────────────────────────────────────────────────────

[global_tags]
  # Optional: tag every metric with the collector name
  collector = "karman"

[agent]
  interval         = "30s"
  round_interval   = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval   = "10s"
  flush_jitter     = "0s"
  precision        = ""
  hostname         = ""
  omit_hostname    = false

# ── Output: Prometheus client endpoint ──────────────────────────────────────
[[outputs.prometheus_client]]
  # Port is set via TELEGRAF_METRICS_PORT env var (default 9273).
  # Change in .env if that port is already in use.
  listen         = ":${TELEGRAF_METRICS_PORT}"
  metric_version = 2
  expiration_interval = "120s"

# ── Input: gNMI subscribe (TerminAttr) ──────────────────────────────────────
[[inputs.gnmi]]
  ## Addresses of TerminAttr endpoints  (host:port)
  ## Add one entry per gNMI-managed device.
  addresses = [
    "192.168.2.15:6030",   # switch5
  ]

  username = "admin"
  password = "b"

  ## Reconnect if the stream drops
  redial = "10s"

  ## Plaintext gRPC — vEOS-lab ships without TLS on TerminAttr by default.
  ## Set enable_tls = true and configure tls_* options for production devices.
  enable_tls = false

  # ── Interface operational status ──────────────────────────────────────────
  # Reports operStatus (up/down) for every data-plane Ethernet interface.
  # Uses Arista's eos_native origin because OpenConfig interfaces are not
  # populated on vEOS-lab without a CVP licence.
  [[inputs.gnmi.subscription]]
    name              = "interface_status"
    origin            = "eos_native"
    path              = "/Sysdb/interface/status/eth/phy/slice/1/intfStatus"
    subscription_mode = "sample"
    sample_interval   = "30s"
