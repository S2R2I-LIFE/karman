# Device Variables for spine1-dc1
hostname: spine1-dc1
domain_name: datacenter.local

dns_servers:
  - ip: 8.8.8.8
    vrf: management
  - ip: 8.8.4.4
    vrf: management

ntp_servers:
  - ip: 10.0.0.1
    vrf: management
    prefer: true

logging_servers:
  - ip: 10.0.0.10
    protocol: udp
    port: 514

local_users:
  - name: admin
    privilege: 15
    role: network-admin
    password_hash: $6$7u4j1ij2gg.wE.q7$E4cXxyMwN3TiN5V5/h8gjnLmJlSMEhR.MYE5sM.4E1N6xX3DK5zK8a6I8/Zw5tF8k7R1

# Interfaces
interfaces:
  - name: Ethernet1
    description: "Downlink to Leaf1"
    mode: routed
    ip_address: 10.1.1.0/31
    enabled: true
  - name: Ethernet2
    description: "Downlink to Leaf2"
    mode: routed
    ip_address: 10.1.1.2/31
    enabled: true
  - name: Ethernet3
    description: "Downlink to Leaf3"
    mode: routed
    ip_address: 10.1.1.4/31
    enabled: true
  - name: Ethernet4
    description: "Downlink to Leaf4"
    mode: routed
    ip_address: 10.1.1.6/31
    enabled: true

# BGP Configuration
bgp:
  asn: 65100
  router_id: 10.0.100.1
  max_paths: 4
  ecmp_paths: 4
  evpn_enabled: true
  neighbors:
    - ip: 10.1.1.1
      remote_asn: 65001
      description: "leaf1"
    - ip: 10.1.1.3
      remote_asn: 65002
      description: "leaf2"
    - ip: 10.1.1.5
      remote_asn: 65003
      description: "leaf3"
    - ip: 10.1.1.7
      remote_asn: 65004
      description: "leaf4"
  networks:
    - 10.0.100.1/32

# OSPF Configuration (alternative to BGP underlay)
ospf:
  process_id: 1
  router_id: 10.0.100.1
  max_paths: 4
  networks:
    - prefix: 10.1.1.0/24
      area: 0.0.0.0
    - prefix: 10.0.100.1/32
      area: 0.0.0.0
