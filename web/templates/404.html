<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - Kármán</title>
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #020b18;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #starfield {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.12;
            z-index: 0;
            pointer-events: none;
        }
        .nebula-1 {
            width: 600px; height: 400px;
            background: radial-gradient(ellipse, #3b1f6b, transparent 70%);
            top: -100px; left: -100px;
            animation: nebula-drift 40s ease-in-out infinite alternate;
        }
        .nebula-2 {
            width: 500px; height: 350px;
            background: radial-gradient(ellipse, #0d3d6b, transparent 70%);
            bottom: -80px; right: -80px;
            animation: nebula-drift 50s ease-in-out infinite alternate-reverse;
        }
        .nebula-3 {
            width: 300px; height: 300px;
            background: radial-gradient(ellipse, #1a4a2e, transparent 70%);
            top: 40%; left: 55%;
            opacity: 0.08;
            animation: nebula-drift 35s ease-in-out infinite alternate;
        }
        @keyframes nebula-drift {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(40px, 20px) scale(1.08); }
        }

        .error-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
            padding: 1rem;
            text-align: center;
        }

        .error-glass {
            background: rgba(10, 20, 40, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 16px;
            backdrop-filter: blur(18px) saturate(1.4);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
            box-shadow:
                0 0 0 1px rgba(100, 160, 255, 0.08),
                0 8px 32px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            padding: 3rem 2.5rem;
        }

        .error-icon {
            font-size: 3.5rem;
            background: linear-gradient(135deg, #60a0ff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 14px rgba(96, 160, 255, 0.45));
            display: inline-block;
            margin-bottom: 1rem;
            animation: icon-float 4s ease-in-out infinite;
        }
        @keyframes icon-float {
            0%, 100% { transform: translateY(0);    }
            50%       { transform: translateY(-8px); }
        }

        .error-code {
            font-size: 5rem;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, #a0c4ff, #e0d0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
            margin-bottom: 0.5rem;
        }

        .error-title {
            color: #f0f6ff;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.6rem;
        }

        .error-message {
            color: rgba(190, 215, 255, 0.6);
            font-size: 0.92rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.6rem 1.6rem;
            background: linear-gradient(135deg, #3b6fd4, #7c3aed);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 500;
            font-size: 0.9rem;
            letter-spacing: 0.03em;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            transition: opacity 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(96, 80, 200, 0.35);
        }
        .btn-home:hover {
            opacity: 0.9;
            box-shadow: 0 4px 28px rgba(96, 80, 200, 0.55);
            color: #fff;
        }
        .btn-home::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.10), transparent 60%);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>
    <canvas id="starfield"></canvas>

    <div class="error-wrapper">
        <div class="error-glass">
            <div class="error-icon"><i class="bi bi-compass"></i></div>
            <div class="error-code">404</div>
            <div class="error-title">Lost in Space</div>
            <p class="error-message">The page you're looking for has drifted out of orbit.<br>It doesn't exist — or never did.</p>
            <a href="/" class="btn-home">
                <i class="bi bi-house"></i> Back to Dashboard
            </a>
        </div>
    </div>

    <script>
    (function () {
        const canvas = document.getElementById('starfield');
        const ctx    = canvas.getContext('2d');

        function resize() {
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', () => { resize(); buildStars(); });
        resize();

        const STAR_COUNT = 320;
        let stars = [];

        function buildStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                const r = Math.random();
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: r < 0.70 ? 0.5 + Math.random() * 0.6
                         : r < 0.92 ? 1.0 + Math.random() * 0.8
                         :             1.8 + Math.random() * 1.0,
                    alpha: 0.35 + Math.random() * 0.65,
                    alphaTarget: 0.25 + Math.random() * 0.75,
                    alphaSpeed:  0.003 + Math.random() * 0.012,
                    hue: Math.random() < 0.15
                           ? `hsl(${30  + Math.random()*30},  60%, 95%)`
                           : `hsl(${200 + Math.random()*60}, 60%, 95%)`,
                });
            }
        }
        buildStars();

        let shooters = [];

        function spawnShooter() {
            const edge   = Math.floor(Math.random() * 4);
            const spread = 40;
            let x, y, baseDeg;
            switch (edge) {
                case 0: x = Math.random() * canvas.width;  y = -10;                baseDeg = 90;  break;
                case 1: x = canvas.width + 10;              y = Math.random() * canvas.height; baseDeg = 180; break;
                case 2: x = Math.random() * canvas.width;  y = canvas.height + 10; baseDeg = 270; break;
                default: x = -10; y = Math.random() * canvas.height; baseDeg = 0; break;
            }
            const angle = (baseDeg + (Math.random() * spread * 2 - spread)) * Math.PI / 180;
            shooters.push({
                x, y, angle,
                speed:     9 + Math.random() * 14,
                length:    90 + Math.random() * 180,
                alpha:     0,
                phase:     'fadein',
                traveled:  0,
                maxTravel: 350 + Math.random() * 400,
                width:     1.0 + Math.random() * 1.2,
            });
        }

        let nextShooterIn   = 1800 + Math.random() * 3000;
        let lastShooterTime = 0;

        function draw(ts) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (const s of stars) {
                s.alpha += s.alpha < s.alphaTarget ?  s.alphaSpeed : -s.alphaSpeed;
                if (Math.abs(s.alpha - s.alphaTarget) < 0.01) {
                    s.alphaTarget = 0.15 + Math.random() * 0.85;
                    s.alphaSpeed  = 0.002 + Math.random() * 0.010;
                }
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fillStyle = s.hue.replace(')', `, ${s.alpha.toFixed(3)})`).replace('hsl(', 'hsla(');
                ctx.fill();
            }

            if (ts - lastShooterTime > nextShooterIn) {
                spawnShooter();
                if (Math.random() < 0.18) spawnShooter();
                lastShooterTime = ts;
                nextShooterIn   = 1500 + Math.random() * 4000;
            }

            for (let i = shooters.length - 1; i >= 0; i--) {
                const s  = shooters[i];
                const dx = Math.cos(s.angle) * s.speed;
                const dy = Math.sin(s.angle) * s.speed;
                if      (s.phase === 'fadein')  { s.alpha += 0.08; if (s.alpha >= 1) { s.alpha = 1; s.phase = 'travel'; } }
                else if (s.phase === 'travel')  { s.traveled += s.speed; if (s.traveled > s.maxTravel) s.phase = 'fadeout'; }
                else { s.alpha -= 0.05; if (s.alpha <= 0) { shooters.splice(i, 1); continue; } }

                const tx = s.x - Math.cos(s.angle) * s.length;
                const ty = s.y - Math.sin(s.angle) * s.length;
                const grad = ctx.createLinearGradient(tx, ty, s.x, s.y);
                grad.addColorStop(0,   `rgba(255,255,255,0)`);
                grad.addColorStop(0.6, `rgba(200,230,255,${(s.alpha*0.4).toFixed(3)})`);
                grad.addColorStop(1,   `rgba(255,255,255,${s.alpha.toFixed(3)})`);
                ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(s.x, s.y);
                ctx.strokeStyle = grad; ctx.lineWidth = s.width; ctx.lineCap = 'round'; ctx.stroke();

                const hg = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 4);
                hg.addColorStop(0, `rgba(255,255,255,${s.alpha.toFixed(3)})`);
                hg.addColorStop(1, `rgba(200,230,255,0)`);
                ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, Math.PI*2);
                ctx.fillStyle = hg; ctx.fill();

                s.x += dx; s.y += dy;
            }
            requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);
    })();
    </script>
</body>
</html>
