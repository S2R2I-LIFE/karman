<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kármán</title>
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #020b18;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: inherit;
        }

        /* Wide banner — cinematic strip pinned to the bottom with fade */
        .wide-banner {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 60vh;
            background: url("{{ url_for('static', filename='img/login-bg.png') }}") center top / cover no-repeat;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 70%);
            mask-image: linear-gradient(to bottom, transparent 0%, black 70%);
            filter: brightness(0.55);
            z-index: 1;
            pointer-events: none;
        }

        #starfield {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        /* Subtle nebula glow layers */
        .nebula {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.12;
            z-index: 0;
            pointer-events: none;
        }
        .nebula-1 {
            width: 600px; height: 400px;
            background: radial-gradient(ellipse, #3b1f6b, transparent 70%);
            top: -100px; left: -100px;
            animation: nebula-drift 40s ease-in-out infinite alternate;
        }
        .nebula-2 {
            width: 500px; height: 350px;
            background: radial-gradient(ellipse, #0d3d6b, transparent 70%);
            bottom: -80px; right: -80px;
            animation: nebula-drift 50s ease-in-out infinite alternate-reverse;
        }
        .nebula-3 {
            width: 300px; height: 300px;
            background: radial-gradient(ellipse, #1a4a2e, transparent 70%);
            top: 40%; left: 55%;
            opacity: 0.08;
            animation: nebula-drift 35s ease-in-out infinite alternate;
        }
        @keyframes nebula-drift {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(40px, 20px) scale(1.08); }
        }

        /* Login card — glassmorphism */
        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 1rem;
        }

        .login-glass {
            background: rgba(10, 20, 40, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 16px;
            backdrop-filter: blur(18px) saturate(1.4);
            -webkit-backdrop-filter: blur(18px) saturate(1.4);
            box-shadow:
                0 0 0 1px rgba(100, 160, 255, 0.08),
                0 8px 32px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
            overflow: hidden;
        }

        .login-header {
            padding: 2rem 2rem 1.25rem;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .brand-icon {
            display: inline-block;
            margin-bottom: 0.75rem;
            filter: drop-shadow(0 0 16px rgba(96, 160, 255, 0.5));
        }
        .brand-icon img {
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .login-header h4 {
            color: #e8f0ff;
            font-weight: 600;
            letter-spacing: 0.03em;
            margin-bottom: 0.2rem;
        }

        .login-header p {
            color: rgba(180, 200, 240, 0.55);
            font-size: 0.82rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .login-body { padding: 1.75rem 2rem; }

        /* Form controls — dark glass inputs */
        .form-label {
            color: rgba(180, 210, 255, 0.75);
            font-size: 0.82rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.4rem;
        }

        .input-group-text {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-right: none;
            color: rgba(150, 190, 255, 0.7);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-left: none;
            color: #d0e4ff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control::placeholder { color: rgba(140, 170, 220, 0.35); }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(96, 160, 255, 0.45);
            box-shadow: 0 0 0 3px rgba(96, 160, 255, 0.12);
            color: #e8f0ff;
        }

        .form-control:focus + .input-group-text,
        .input-group:focus-within .input-group-text {
            border-color: rgba(96, 160, 255, 0.45);
        }

        .form-check-input {
            background-color: rgba(255,255,255,0.07);
            border-color: rgba(255,255,255,0.20);
        }
        .form-check-input:checked {
            background-color: #60a0ff;
            border-color: #60a0ff;
        }
        .form-check-label { color: rgba(180, 200, 240, 0.6); font-size: 0.88rem; }

        /* Sign-in button */
        .btn-signin {
            width: 100%;
            padding: 0.65rem;
            background: linear-gradient(135deg, #3b6fd4, #7c3aed);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: 500;
            letter-spacing: 0.04em;
            position: relative;
            overflow: hidden;
            transition: opacity 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(96, 80, 200, 0.35);
        }
        .btn-signin:hover {
            opacity: 0.92;
            box-shadow: 0 4px 28px rgba(96, 80, 200, 0.55);
            color: #fff;
        }
        .btn-signin::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.10), transparent 60%);
            pointer-events: none;
        }

        .login-footer {
            padding: 0.9rem 2rem 1.25rem;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .login-footer a { color: #60a0ff; text-decoration: none; }
        .login-footer a:hover { text-decoration: underline; }
        .login-footer p { color: rgba(150, 180, 230, 0.5); font-size: 0.85rem; margin: 0; }

        .card-ver {
            display: block;
            margin-top: 0.6rem;
            color: rgba(120, 150, 200, 0.3);
            font-size: 0.72rem;
            letter-spacing: 0.08em;
        }

        /* Alert overrides */
        .alert { font-size: 0.87rem; }
        .alert-danger  { background: rgba(200,50,50,0.18);  border-color: rgba(200,50,50,0.35);  color: #ffaaaa; }
        .alert-success { background: rgba(50,180,100,0.18); border-color: rgba(50,180,100,0.35); color: #aaffcc; }
        .alert-warning { background: rgba(200,160,0,0.18);  border-color: rgba(200,160,0,0.35);  color: #ffe980; }
        .btn-close { filter: invert(1) brightness(0.7); }
    </style>
</head>
<body>

    <!-- Nebula glow layers -->
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>

    <!-- Star canvas -->
    <canvas id="starfield"></canvas>

    <!-- Wide banner strip -->
    <div class="wide-banner"></div>

    <!-- Login card -->
    <div class="login-wrapper">
        <div class="login-glass">
            <div class="login-header">
                <div class="brand-icon">
                    <img src="{{ url_for('static', filename='img/logo-circle.png') }}"
                         alt="Kármán" width="80" height="80">
                </div>
                <h4>Kármán</h4>
                <p>Beyond the Cloud</p>
            </div>

            <div class="login-body">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="Enter username" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="Enter password" required>
                        </div>
                    </div>
                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>
                    <button type="submit" class="btn-signin">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>
                </form>
            </div>

            <div class="login-footer">
                <p>Don't have an account? <a href="{{ url_for('register') }}">Request access</a></p>
                <span class="card-ver">v1.0.0 &nbsp;·&nbsp; Secure Authentication</span>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    (function () {
        const canvas = document.getElementById('starfield');
        const ctx    = canvas.getContext('2d');

        // ── resize ──────────────────────────────────────────────────────────
        function resize() {
            canvas.width  = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', () => { resize(); buildStars(); });
        resize();

        // ── stars ────────────────────────────────────────────────────────────
        const STAR_COUNT = 320;
        let stars = [];

        function buildStars() {
            stars = [];
            for (let i = 0; i < STAR_COUNT; i++) {
                const r = Math.random();
                stars.push({
                    x:       Math.random() * canvas.width,
                    y:       Math.random() * canvas.height,
                    // size tiered: most tiny, a few larger
                    size:    r < 0.70 ? 0.5 + Math.random() * 0.6
                           : r < 0.92 ? 1.0 + Math.random() * 0.8
                           :             1.8 + Math.random() * 1.0,
                    // base alpha and twinkle parameters
                    alpha:   0.35 + Math.random() * 0.65,
                    alphaTarget: 0,
                    alphaSpeed:  0.003 + Math.random() * 0.012,
                    // hue tint: mostly white-blue, occasional warm
                    hue:     Math.random() < 0.15
                               ? `hsl(${30  + Math.random()*30},  60%, 95%)`
                               : `hsl(${200 + Math.random()*60}, 60%, 95%)`,
                });
                stars[i].alphaTarget = 0.25 + Math.random() * 0.75;
            }
        }
        buildStars();

        // ── shooting stars ────────────────────────────────────────────────────
        let shooters = [];

        function spawnShooter() {
            // Pick a random edge: 0=top, 1=right, 2=bottom, 3=left
            const edge   = Math.floor(Math.random() * 4);
            const spread = 40; // ± degrees of variation around primary direction
            let x, y, baseDeg;

            switch (edge) {
                case 0: // top → travel downward
                    x       = Math.random() * canvas.width;
                    y       = -10;
                    baseDeg = 90;
                    break;
                case 1: // right → travel leftward
                    x       = canvas.width + 10;
                    y       = Math.random() * canvas.height;
                    baseDeg = 180;
                    break;
                case 2: // bottom → travel upward
                    x       = Math.random() * canvas.width;
                    y       = canvas.height + 10;
                    baseDeg = 270;
                    break;
                default: // left → travel rightward
                    x       = -10;
                    y       = Math.random() * canvas.height;
                    baseDeg = 0;
                    break;
            }

            const angleDeg = baseDeg + (Math.random() * spread * 2 - spread);
            const angle    = angleDeg * Math.PI / 180;

            shooters.push({
                x, y, angle,
                speed:     9 + Math.random() * 14,
                length:    90 + Math.random() * 180,
                alpha:     0,
                phase:     'fadein',
                traveled:  0,
                maxTravel: 350 + Math.random() * 400,
                width:     1.0 + Math.random() * 1.2,
            });
        }

        // Schedule next shooter with randomised interval
        let nextShooterIn = 1800 + Math.random() * 3000; // ms
        let lastShooterTime = 0;

        // ── draw one frame ────────────────────────────────────────────────────
        function draw(timestamp) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // -- draw static stars with twinkle
            for (const s of stars) {
                // nudge alpha toward target
                if (s.alpha < s.alphaTarget) {
                    s.alpha = Math.min(s.alphaTarget, s.alpha + s.alphaSpeed);
                } else {
                    s.alpha = Math.max(s.alphaTarget, s.alpha - s.alphaSpeed);
                }
                // flip target occasionally
                if (Math.abs(s.alpha - s.alphaTarget) < 0.01) {
                    s.alphaTarget = 0.15 + Math.random() * 0.85;
                    s.alphaSpeed  = 0.002 + Math.random() * 0.010;
                }

                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fillStyle = s.hue.replace(')', `, ${s.alpha.toFixed(3)})`).replace('hsl(', 'hsla(');
                ctx.fill();
            }

            // -- spawn shooters on schedule
            if (timestamp - lastShooterTime > nextShooterIn) {
                // occasionally fire 2 at once
                spawnShooter();
                if (Math.random() < 0.18) spawnShooter();
                lastShooterTime = timestamp;
                nextShooterIn   = 1500 + Math.random() * 4000;
            }

            // -- draw & update shooters
            for (let i = shooters.length - 1; i >= 0; i--) {
                const s = shooters[i];
                const dx = Math.cos(s.angle) * s.speed;
                const dy = Math.sin(s.angle) * s.speed;

                // fade lifecycle
                if (s.phase === 'fadein') {
                    s.alpha += 0.08;
                    if (s.alpha >= 1) { s.alpha = 1; s.phase = 'travel'; }
                } else if (s.phase === 'travel') {
                    s.traveled += s.speed;
                    if (s.traveled > s.maxTravel) s.phase = 'fadeout';
                } else {
                    s.alpha -= 0.05;
                    if (s.alpha <= 0) { shooters.splice(i, 1); continue; }
                }

                // tail start point (trailing end)
                const tx = s.x - Math.cos(s.angle) * s.length;
                const ty = s.y - Math.sin(s.angle) * s.length;

                const grad = ctx.createLinearGradient(tx, ty, s.x, s.y);
                grad.addColorStop(0, `rgba(255,255,255,0)`);
                grad.addColorStop(0.6, `rgba(200,230,255,${(s.alpha * 0.4).toFixed(3)})`);
                grad.addColorStop(1, `rgba(255,255,255,${s.alpha.toFixed(3)})`);

                ctx.beginPath();
                ctx.moveTo(tx, ty);
                ctx.lineTo(s.x, s.y);
                ctx.strokeStyle = grad;
                ctx.lineWidth = s.width;
                ctx.lineCap = 'round';
                ctx.stroke();

                // bright head glow
                const headGlow = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 4);
                headGlow.addColorStop(0, `rgba(255,255,255,${s.alpha.toFixed(3)})`);
                headGlow.addColorStop(1, `rgba(200,230,255,0)`);
                ctx.beginPath();
                ctx.arc(s.x, s.y, 4, 0, Math.PI * 2);
                ctx.fillStyle = headGlow;
                ctx.fill();

                // advance position
                s.x += dx;
                s.y += dy;
            }

            requestAnimationFrame(draw);
        }

        requestAnimationFrame(draw);
    })();
    </script>
</body>
</html>
